# Host-specific Borgmatic configuration for iris-server.
source_directories:
  - ~/homeassistant/config/backups
  - ~/homeassistant/docker-compose.yml
  - ~/.dotfiles/home/files/borgmatic/iris-server.yaml

# Read the passphrase from the SOPS-deployed user secret, never from Git.
encryption_passcommand: "cat /home/brandon/.config/sops-nix/secrets/borgmatic-passphrase"

repositories:
  - path: /mnt/backup/borg/iris-server
    label: iris-server
    encryption: repokey-blake2

compression: zstd,3

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

# Retry transient backup failures, with increasing waits between attempts.
retries: 3
retry_wait: 60

# Check repository/archive metadata monthly, and verify all backup data quarterly.
checks:
  - name: repository
    frequency: 1 month
  - name: archives
    frequency: 1 month
  - name: extract
    frequency: 1 month
  - name: data
    frequency: 3 months

archive_name_format: '{hostname}-{now}'
